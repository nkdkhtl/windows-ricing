watch_stylesheet: true
watch_config: true
debug: false
bars:
    status-bar:
        enabled: true
        screens: ["*"]
        class_name: "yasb-bar"
        alignment:
            position: "top"
            center: false
        blur_effect:
            enabled: false
            acrylic: false
            dark_mode: true
            round_corners: true
            border_color: None
        window_flags:
            always_on_top: false
            windows_app_bar: true
        dimensions:
            width: "98%"
            height: 36
        widgets:
            left: [
                    "home",
                    "komorebi_control",
                    "quick_launch",
                    "workspaces",
                    "media",
                    # "taskbar"
                ]
            center: ["clock", "weather", "cpu", "memory"]
            right:
                [
                    "systray",
                    "bluetooth",
                    "wifi",
                    "volume",
                    "battery",
                    "settings",
                    "notifications",
                    "power_menu",
                ]
widgets:
    home:
        type: "yasb.home.HomeWidget"
        options:
            label: "<span>\ue62a</span>"
            menu_labels:
                about: "\ue66A  About This PC"
                system: "\uF423  System Settings"
                task_manager: "\uf437  Task Manager"
                hibernate: "\uf28e  Hibernate"
                sleep: "\u23fe   Sleep"
                restart: "\uead2   Restart"
                shutdown: "\uf011   Shutdown"
                lock: "\uea75   Lock"
                logout: "\udb80\udf43   Logout"
            menu_list:
                - { title: "\uE617  User Home", path: "~" }
                - { title: "\udb80\udd20  Download", path: "~\\Downloads" }
                - { title: "\udb80\ude1a  Documents", path: "~\\Documents" }
                - { title: "\uf03e  Pictures", path: "~\\Pictures" }
            system_menu: true
            power_menu: true
            blur: true
            border_color: "System"
            round_corners_type: "normal"
    clock:
        type: "yasb.clock.ClockWidget"
        options:
            label: "{%a %d %b %H:%M}"
            label_alt: "{%A, %d %B %Y, %H:%M}"
            locale: "en_EN" # Langugae for date, you can set your own, example fr_FR
            timezones: ["Asia/Saigon"] #Looking up time zone info from registry
            #timezones: ["America/Montreal"]
            callbacks:
                on_middle: "next_timezone"
                on_right: "exec cmd.exe /c start ms-clock:"
            calendar:
                blur: True
                round_corners: True
                round_corners_type: "normal"
                border_color: "System"
                alignment: "center"
                direction: "down"
                show_holidays: true
                show_week_numbers: true
                country_code: "PL"
                holiday_color: "#FF6464"
    weather:
        type: "yasb.weather.WeatherWidget"
        options:
            label: "<span>{icon}</span> {temp}"
            label_alt: "<span>{icon}</span> {location}: {temp}, Min {min_temp}, Max {max_temp}, Wind {wind}"
            api_key: "3bf4cf9a7c3f40d6b31174128242807" # Get your free API key from https://www.weatherapi.com/
            update_interval: 600 # Update interval in seconds, Min 600 seconds
            hide_decimal: true
            location: "Ha Noi" # You can use "USA Los Angeles 90006" {COUNTRY CITY ZIP_CODE}, or just city.
            callbacks:
                on_left: "toggle_card"
                on_middle: "toggle_label"
            icons:
                sunnyDay: "\ue30d"
                clearNight: "\ue32b"
                cloudyDay: "\ue312"
                cloudyNight: "\ue311"
                rainyDay: "\ue308"
                rainyNight: "\ue333"
                snowyDay: "\ue30a"
                snowyNight: "\ue335"
                blizzardDay: "\udb83\udf36"
                blizzardNight: "\udb83\udf36"
                foggyDay: "\ue303"
                foggyNight: "\ue346"
                thunderstormDay: "\ue30f"
                thunderstormNight: "\ue338"
                default: "\uebaa"
            weather_card:
                blur: true
                round_corners: true
                round_corners_type: "normal"
                border_color: "system"
                alignment: "center"
                direction: "down"
                icon_size: 64
                show_hourly_forecast: true # Set to False to disable hourly forecast
                time_format: "24h" # can be 12h or 24h
                hourly_point_spacing: 76
                hourly_icon_size: 32 # better to set 16, 32 or 64 for better quality
                icon_smoothing: true # should be true for smoother icon or false for sharper icon if using 16, 32 or 64 for hourly_icon_size
                temp_line_width: 3 # can be 0 to hide the temperature line
    volume:
        type: "yasb.volume.VolumeWidget"
        options:
            label: "{icon} {level}"
            # label_alt: "{volume}"
            tooltip: false
            volume_icons:
                - "\ueee8" # Icon for muted
                - "\uf026" # Icon for 0-10% volume
                - "\uf027" # Icon for 11-30% volume
                - "\uf027" # Icon for 31-60% volume
                - "\uf028" # Icon for 61-100% volume
            callbacks:
                on_middle: "toggle_mute"
                on_right: "exec cmd.exe /c start ms-settings:sound"
            audio_menu:
                blur: true
                round_corners: true
                round_corners_type: "normal"
                border_color: "System"
                alignment: "center"
                direction: "down"
    power_menu:
        type: "yasb.power_menu.PowerMenuWidget"
        options:
            label: "\uf011"
            uptime: True
            blur: False
            blur_background: True
            animation_duration: 300 # Milisecond
            button_row: 3 # Number of buttons in row, min 1 max 5
            buttons:
                lock: ["\uea75", "Lock"]
                signout: ["\udb80\udf43", "Sign out"]
                shutdown: ["\uf011", "Shut Down"]
                restart: ["\uead2", "Restart"]
                hibernate: ["\uf28e", "Hibernate"]
                cancel: ["\udb81\udf3a", "Cancel"]
    settings:
        type: "yasb.applications.ApplicationsWidget"
        options:
            label: "{data}"
            app_list:
                - { icon: "\ue690", launch: "quick_settings" }
    notifications:
        type: "yasb.notifications.NotificationsWidget"
        options:
            label: "<span>\udb80\udd78</span> {count}"
            tooltip: false
            callbacks:
                on_left: "toggle_notification"
                on_right: "do_nothing"
                on_middle: "do_nothing"

    cpu:
        type: "yasb.cpu.CpuWidget"
        options:
            label: "\uf4bc {info[percent][total]}%"
            label_alt: "\uf4bc {info[freq][current]} Mhz {info[histograms][cores]}"
            update_interval: 2000
            cpu_thresholds:
                low: 25
                medium: 50
                high: 90
            histogram_icons:
                - "\u2581" # 0%
                - "\u2581" # 10%
                - "\u2582" # 20%
                - "\u2583" # 30%
                - "\u2584" # 40%
                - "\u2585" # 50%
                - "\u2586" # 60%
                - "\u2587" # 70%
                - "\u2588" # 80%+
            histogram_num_columns: 8
            callbacks:
                on_left: "do_nothing"
                on_middle: "toggle_label"
                on_right: "exec cmd /c Taskmgr"
            label_shadow:
                enabled: true
                color: "black"
                radius: 3
                offset: [1, 1]
    memory:
        type: "yasb.memory.MemoryWidget"
        options:
            label: "\uefc5 {virtual_mem_used}"
            label_alt: "\uefc5 VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
            update_interval: 5000
            callbacks:
                on_left: "do_nothing"
                on_middle: "toggle_label"
                on_right: "exec cmd /c Taskmgr"
            memory_thresholds:
                low: 25
                medium: 50
                high: 90
    taskbar:
        type: "yasb.taskbar.TaskbarWidget"
        options:
            icon_size: 16
            tooltip: false
            show_only_visible: false
            strict_filtering: false
            monitor_exclusive: true
            animation:
                enabled: true
            preview:
                enabled: true
                width: 450
                delay: 400
                padding: 12
            ignore_apps:
                processes: []
                titles: []
                classes: []
    workspaces:
        type: "komorebi.workspaces.WorkspaceWidget"
        options:
            label_offline: "Komorebi Offline"
            label_workspace_btn: "\udb81\udc3d"
            label_workspace_active_btn: "\udb81\udc3e"
            label_workspace_populated_btn: "\udb81\udc3e"
            label_default_name: ""
            label_zero_index: false
            hide_empty_workspaces: false
            hide_if_offline: false
            toggle_workspace_layer:
                enabled: false
                tiling_label: "Tiling"
                floating_label: "Floating"
            app_icons:
                enabled_populated: true
                enabled_active: true
                size: 12
                max_icons: 0
                hide_label: false
                hide_duplicates: false
                hide_floating: false
    systray:
        type: "yasb.systray.SystrayWidget"
        options:
            class_name: "systray"
            label_collapsed: "◀"
            label_expanded: "▶"
            label_position: "right" # Can be "left" or "right"
            icon_size: 16 # Can be any integer between 8 and 64
            pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
            show_unpinned: false
            show_unpinned_button: true
            show_battery: false
            show_volume: false
            show_network: false
    media:
        type: "yasb.media.MediaWidget"
        options:
            label: "{title} - {artist}"
            label_alt: ""
            hide_empty: true
            callbacks:
                on_left: "toggle_media_menu"
                on_middle: "do_nothing"
                on_right: "do_nothing"
            max_field_size:
                label: 30
                label_alt: 30
            show_thumbnail: false
            controls_only: false
            controls_left: true
            controls_hide: false
            thumbnail_alpha: 80
            thumbnail_padding: 8
            thumbnail_corner_radius: 16
            icons:
                prev_track: "\ue892"
                next_track: "\ue893"
                play: "\ue768"
                pause: "\ue769"
            media_menu:
                blur: true
                round_corners: true
                round_corners_type: "normal"
                border_color: "system"
                alignment: "center"
                direction: "down"
                offset_top: 6
                offset_left: 0
                thumbnail_corner_radius: 8
                thumbnail_size: 120
                max_title_size: 90
                max_artist_size: 40
                show_source: true
                show_volume_slider: true
            media_menu_icons:
                play: "\ue768"
                pause: "\ue769"
                prev_track: "\ue892"
                next_track: "\ue893"
            scrolling_label:
                enabled: false
                update_interval_ms: 13
                style: "left" # can be "left", "right", "bounce", "bounce-ease"
                separator: "    |    "
                label_padding: 10
    battery:
        type: "yasb.battery.BatteryWidget"
        options:
            label: "<span>{icon}</span> {percent}%"
            label_alt: "<span>{icon}</span> {percent}% | {power}W | {time_remaining}"
            update_interval: 5000
            time_remaining_natural: False
            hide_unsupported: True
            charging_options:
                icon_format: "{charging_icon}"
                blink_charging_icon: true
                blink_interval: 500
            status_thresholds:
                critical: 10
                low: 25
                medium: 75
                high: 95
                full: 100
            status_icons:
                icon_charging: "\uf0e7"
                icon_critical: "\uf244"
                icon_low: "\uf243"
                icon_medium: "\uf242"
                icon_high: "\uf241"
                icon_full: "\uf240"
    wifi:
        type: "yasb.wifi.WifiWidget"
        options:
            label: "<span>{wifi_icon}</span>"
            label_alt: "{wifi_name} {wifi_strength}%"
            update_interval: 5000
            callbacks:
                on_left: "toggle_menu"
                on_middle: "exec cmd.exe /c start ms-settings:network"
                on_right: "toggle_label"
            ethernet_label: "<span>{wifi_icon}</span>"
            ethernet_label_alt: "<span>{wifi_icon}</span>{ip_addr}"
            ethernet_icon: "\ueba9"
            get_exact_wifi_strength: false # Optional. Will require location access permission if true.
            wifi_icons: [
                    "\udb82\udd2e", # Icon for 0% strength
                    "\udb82\udd1f", # Icon for 1-24% strength
                    "\udb82\udd22", # Icon for 25-49% strength
                    "\udb82\udd25", # Icon for 50-74% strength
                    "\udb82\udd28", # Icon for 75-100% strength
                ]
            menu_config:
                blur: true
                round_corners: true
                round_corners_type: "normal"
                border_color: "System"
                alignment: "right"
                direction: "down"
                offset_top: 6
                offset_left: 0
                wifi_icons_secured: ["\ue670", "\ue671", "\ue672", "\ue673"]
                wifi_icons_unsecured: ["\uec3c", "\uec3d", "\uec3e", "\uec3f"]
    bluetooth:
        type: "yasb.bluetooth.BluetoothWidget"
        options:
            label: "<span>{icon}</span> {device_count}"
            label_alt: "{device_name}"
            label_no_device: "No devices connected"
            label_device_separator: ", "
            max_length: 10
            max_length_ellipsis: "..."
            icons:
                bluetooth_on: "\udb80\udcaf"
                bluetooth_off: "\udb80\udcb2"
                bluetooth_connected: "\udb80\udcb1"
            device_aliases:
                - name: "T5.0"
                  alias: "\uf025"
            callbacks:
                on_left: "toggle_label"
                on_right: "exec cmd.exe /c start ms-settings:bluetooth"
    quick_launch:
        type: "yasb.quick_launch.QuickLaunchWidget"
        options:
            label: "<span>\uf002</span>"
            search_placeholder: "Search applications..."
            max_results: 50
            show_icons: true
            icon_size: 32
            providers:
                apps:
                    enabled: true
                    prefix: "*"
                    priority: 0
                    show_recent: true
                    max_recent: 5
                    show_description: true
                bookmarks:
                    enabled: true
                    prefix: "*"
                    priority: 1
                    browser: "all"
                    profile: "Default"
                calculator:
                    enabled: true
                    prefix: "="
                    priority: 2
                settings:
                    enabled: true
                    prefix: "@"
                    priority: 14
                snippets:
                    enabled: true
                    prefix: ";"
                    priority: 15
                    type_delay: 200
                system_commands:
                    enabled: true
                    prefix: ">"
                    priority: 16
                unit_converter:
                    enabled: true
                    prefix: "~"
                    priority: 17
                vscode:
                    enabled: true
                    prefix: "vsc"
                    priority: 18
                web_search:
                    enabled: true
                    prefix: "?"
                    priority: 19
                    engine: "google"
                window_switcher:
                    enabled: true
                    prefix: "win"
                    priority: 20
                windows_terminal:
                    enabled: true
                    prefix: "wt"
                    priority: 21
                world_clock:
                    enabled: true
                    prefix: "tz"
                    priority: 22
                wsl:
                    enabled: true
                    prefix: "wsl"
                    priority: 23
                    show_online: true
            popup:
                width: 720
                height: 480
                blur: true
                round_corners: true
                round_corners_type: "normal"
                border_color: "system"
                dark_mode: true
            callbacks:
                on_left: "toggle_quick_launch"
            keybindings:
                - keys: "alt+space"
                  action: "toggle_quick_launch"
    komorebi_control:
        type: "komorebi.control.KomorebiControlWidget"
        options:
            label: "<span>\udb80\uddd9</span>"
            icons:
                start: "\uead3"
                stop: "\uead7"
                reload: "\uead2"
            run_ahk: false
            run_whkd: false
            run_masir: false
            show_version: true
            komorebi_menu:
                blur: true
                round_corners: true
                round_corners_type: "normal"
                border_color: "System"
                alignment: "left"
                direction: "down"
                offset_top: 6
                offset_left: 0
